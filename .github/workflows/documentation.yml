name: Documentation

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: read
  statuses: write

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: '1.10'

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Cache Julia artifacts
        uses: julia-actions/cache@v2

      - name: Install documentation dependencies
        shell: julia --color=yes --project=2026-05/docs {0}
        run: |
          using Pkg
          Pkg.develop(Pkg.PackageSpec(path="2026-05"))
          Pkg.instantiate()

      - name: Render Quarto slides
        run: quarto render 2026-05/slides

      - name: Build and deploy documentation
        run: julia --color=yes --project=2026-05/docs 2026-05/docs/make.jl
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}